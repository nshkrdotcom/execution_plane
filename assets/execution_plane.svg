<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="execution-title execution-desc">
  <title id="execution-title">Execution Plane</title>
  <desc id="execution-desc">A hexagonal runtime node dispatching attested execution requests across process, HTTP, JSON-RPC, and stream lanes.</desc>
  <defs>
    <clipPath id="execution-hex">
      <path d="M100 4 L183 52 L183 148 L100 196 L17 148 L17 52 Z"/>
    </clipPath>
    <linearGradient id="execution-bg" x1="25" y1="20" x2="176" y2="181" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f2b3a"/>
      <stop offset="0.55" stop-color="#101925"/>
      <stop offset="1" stop-color="#070b10"/>
    </linearGradient>
    <linearGradient id="execution-lane" x1="38" y1="90" x2="164" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffdd6e"/>
      <stop offset="0.5" stop-color="#70f0ff"/>
      <stop offset="1" stop-color="#96ff91"/>
    </linearGradient>
    <filter id="execution-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
