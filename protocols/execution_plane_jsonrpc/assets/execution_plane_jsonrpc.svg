<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">Execution Plane JSON-RPC</title>
  <desc id="desc">A symmetric hexagonal mark showing a braced JSON-RPC envelope with a correlated request and response pair, an id-less notification frame, newline frame rules, and an error-code node.</desc>
  <defs>
    <linearGradient id="epjHexFill" x1="24" y1="24" x2="176" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#120b27"/>
      <stop offset="0.45" stop-color="#2a1b4a"/>
      <stop offset="1" stop-color="#1a1136"/>
    </linearGradient>
    <linearGradient id="epjEdgeGlow" x1="24" y1="100" x2="176" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="epjFacetFill" x1="56" y1="42" x2="144" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338ca" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#6d28d9" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#be185d" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="epjRequestFlow" x1="60" y1="78" x2="140" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="epjResponseFlow" x1="140" y1="100" x2="60" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="epjCoreGlow" cx="100" cy="100" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ddd6fe" stop-opacity="0.9"/>
      <stop offset="0.34" stop-color="#a855f7" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="epjSoftGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a78bfa" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#818cf8" flood-opacity="0.22"/>
    </filter>
    <clipPath id="epjHexClip">
      <polygon points="100,12 176,56 176,144 100,188 24,144 24,56"/>
    </clipPath>
  </defs>

  <polygon
    points="100,12 176,56 176,144 100,188 24,144 24,56"
    fill="url(#epjHexFill)"
    stroke="url(#epjEdgeGlow)"
    stroke-width="4"
    filter="url(#epjSoftGlow)"
  />

  <g clip-path="url(#epjHexClip)">
    <rect x="20" y="20" width="160" height="160" fill="url(#epjCoreGlow)" opacity="0.7"/>

    <path
      d="M10 142 C40 106 66 88 100 88 C134 88 160 106 190 142"
      fill="none"
      stroke="url(#epjEdgeGlow)"
      stroke-width="11"
      stroke-linecap="round"
      opacity="0.18"
    />
    <path
      d="M16 120 C44 90 68 74 100 74 C132 74 156 90 184 120"
      fill="none"
      stroke="#818cf8"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.18"
    />

    <polygon
      points="100,34 145,60 145,118 100,144 55,118 55,60"
      fill="url(#epjFacetFill)"
      opacity="0.7"
    />

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M55 60 L100 80 L145 60" stroke="#c4b5fd" stroke-width="2" opacity="0.45"/>
      <path d="M55 118 L100 98 L145 118" stroke="#c4b5fd" stroke-width="2" opacity="0.45"/>
      <path d="M55 60 L55 118" stroke="#818cf8" stroke-width="1.6" opacity="0.4"/>
      <path d="M145 60 L145 118" stroke="#818cf8" stroke-width="1.6" opacity="0.4"/>
    </g>

    <g
      fill="none"
      stroke="url(#epjEdgeGlow)"
      stroke-width="3.4"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.95"
    >
      <path d="M52 58 C44 58 46 72 46 84 C46 94 40 98 36 100 C40 102 46 106 46 116 C46 128 44 142 52 142"/>
      <path d="M148 58 C156 58 154 72 154 84 C154 94 160 98 164 100 C160 102 154 106 154 116 C154 128 156 142 148 142"/>
    </g>

    <g stroke-width="1" stroke-dasharray="1.5 4" opacity="0.55" fill="none">
      <path d="M54 87 L144 87" stroke="#c4b5fd"/>
      <path d="M54 109 L144 109" stroke="#c4b5fd"/>
      <path d="M54 131 L144 131" stroke="#c4b5fd"/>
    </g>
    <g stroke="#c4b5fd" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
      <path d="M54 84 L54 90"/>
      <path d="M144 84 L144 90"/>
      <path d="M54 106 L54 112"/>
      <path d="M144 106 L144 112"/>
      <path d="M54 128 L54 134"/>
      <path d="M144 128 L144 134"/>
    </g>

    <g stroke-linecap="round" fill="none">
      <path d="M72 78 L130 78" stroke="url(#epjRequestFlow)" stroke-width="2.8"/>
      <path d="M128 100 L84 100" stroke="url(#epjResponseFlow)" stroke-width="2.8"/>
      <path d="M72 122 L130 122" stroke="#f0abfc" stroke-width="2.4" stroke-dasharray="7 4" opacity="0.9"/>
    </g>
    <g>
      <polygon points="138,78 128,72.8 128,83.2" fill="#f0abfc"/>
      <polygon points="72,100 82,94.8 82,105.2" fill="#5eead4"/>
      <polygon points="138,122 128,116.8 128,127.2" fill="#f0abfc"/>
    </g>

    <g stroke-width="1.2" stroke-linecap="round" opacity="0.5" fill="none">
      <path d="M90 74 L90 82" stroke="#1a1136"/>
      <path d="M108 74 L108 82" stroke="#1a1136"/>
      <path d="M94 96 L94 104" stroke="#1a1136"/>
      <path d="M112 96 L112 104" stroke="#1a1136"/>
      <path d="M90 118 L90 126" stroke="#1a1136"/>
      <path d="M108 118 L108 126" stroke="#1a1136"/>
    </g>

    <path
      d="M138 84 C147 89 147 94 133 98"
      fill="none"
      stroke="#5eead4"
      stroke-width="1.4"
      stroke-dasharray="3 3"
      stroke-linecap="round"
      opacity="0.85"
    />
    <path
      d="M62 85.5 L62 93.5"
      fill="none"
      stroke="#5eead4"
      stroke-width="1.4"
      stroke-dasharray="3 3"
      stroke-linecap="round"
      opacity="0.85"
    />

    <g>
      <polygon
        points="62,71.5 67.6,74.75 67.6,81.25 62,84.5 56.4,81.25 56.4,74.75"
        fill="#c4b5fd"
        stroke="#f8fafc"
        stroke-opacity="0.35"
        stroke-width="1"
      />
      <polygon
        points="62,93.5 67.6,96.75 67.6,103.25 62,106.5 56.4,103.25 56.4,96.75"
        fill="#c4b5fd"
        stroke="#f8fafc"
        stroke-opacity="0.35"
        stroke-width="1"
      />
      <circle cx="62" cy="78" r="1.8" fill="#1a1136"/>
      <circle cx="62" cy="100" r="1.8" fill="#1a1136"/>
      <circle
        cx="62"
        cy="122"
        r="6"
        fill="none"
        stroke="#f0abfc"
        stroke-width="1.6"
        stroke-dasharray="2.6 3"
        opacity="0.85"
      />
    </g>

    <g filter="url(#epjSoftGlow)">
      <polygon
        points="100,33 111.3,39.5 111.3,52.5 100,59 88.7,52.5 88.7,39.5"
        fill="url(#epjEdgeGlow)"
        opacity="0.95"
      />
      <polygon
        points="100,37.5 107.4,41.75 107.4,50.25 100,54.5 92.6,50.25 92.6,41.75"
        fill="#120b27"
        opacity="0.96"
      />
      <g
        fill="none"
        stroke="#c4b5fd"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M98.5 41 C96.5 41 97.5 44 95.5 46 C97.5 48 96.5 51 98.5 51"/>
        <path d="M101.5 41 C103.5 41 102.5 44 104.5 46 C102.5 48 103.5 51 101.5 51"/>
      </g>
    </g>

    <g filter="url(#epjSoftGlow)">
      <polygon
        points="100,143 111.3,149.5 111.3,162.5 100,169 88.7,162.5 88.7,149.5"
        fill="#120b27"
        stroke="url(#epjEdgeGlow)"
        stroke-width="2"
      />
      <path
        d="M100 148.5 L100 157.5"
        fill="none"
        stroke="#fb7185"
        stroke-width="2.2"
        stroke-linecap="round"
      />
      <circle cx="100" cy="162" r="1.7" fill="#fb7185"/>
    </g>

    <g fill="#e0e7ff">
      <circle cx="55" cy="60" r="3"/>
      <circle cx="145" cy="60" r="3"/>
      <circle cx="55" cy="118" r="3"/>
      <circle cx="145" cy="118" r="3"/>
    </g>
  </g>
</svg>
